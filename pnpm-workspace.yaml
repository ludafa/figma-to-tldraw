packages:
  - "apps/*"
  - "packages/*"

# pnpm v11 replaced onlyBuiltDependencies/neverBuiltDependencies with the
# allowBuilds map (pkg: true|false). `pnpm approve-builds` edits this list.
# All four legitimately need their install/build scripts:
#   better-sqlite3 (native addon), esbuild (platform binary), msw (worker), es5-ext (postinstall)
allowBuilds:
  better-sqlite3: true
  # core-js's postinstall only prints a funding banner.
  core-js: false
  es5-ext: true
  esbuild: true
  msw: true

minimumReleaseAgeExclude:
  - hono@4.12.31
